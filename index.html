<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Headway</title>
  <meta name="description" content="Chennai Metro next-train timer built on the official CMRL timetable.">
  <meta name="theme-color" content="#faf9fe">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Headway">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,100..1000,0..100&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&icon_names=add,arrow_back,arrow_drop_down,arrow_forward,bedtime,brightness_auto,calendar_month,check,chevron_right,close,commute,contactless,credit_card,dark_mode,delete,directions_railway,directions_walk,history,info,light_mode,linear_scale,map,more_time,more_vert,notifications,open_in_new,qr_code_2,qr_code_scanner,remove,route,schedule,search,settings,swap_vert,train,transfer_within_a_station,unfold_more,vertical_align_top&display=block">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes light.
    try {
      const t = JSON.parse(localStorage.getItem('headway:v3') || '{}').theme;
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <main id="view" aria-live="off"></main>
  <div id="dock" class="dock"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
