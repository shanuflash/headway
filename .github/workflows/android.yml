name: Android CI

'on':
  push:
    # Branches only: a release tag (CI's own or one published from a local build) mustn't start
    # another build and release.
    branches: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Test and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publishes each build as a GitHub release

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the last release

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle 9.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Unit tests and release build
        run: gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Lint (report only)
        run: gradle --no-daemon lintRelease
        continue-on-error: true

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "headway-2.0.$((GITHUB_RUN_NUMBER + 2000)).apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headway-2.0-run-${{ github.run_number }}
          path: android/headway-2.0.*.apk
          if-no-files-found: error
          retention-days: 14

      # Every build is a release with the plain .apk attached. The newest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/headway.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The versionCode: 2000 + the run (see build.gradle.kts); the updater reads it from the tag.
          version="2.0.$((GITHUB_RUN_NUMBER + 2000))"
          tag="v${version}"
          prev=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          {
            echo "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}."
            echo
            if [ -n "$prev" ]; then
              echo "Changes since ${prev}:"
              git log --no-merges --format='- %s' "${prev}..${GITHUB_SHA}" -- android
            else
              echo "Changes:"
              git log --no-merges --format='- %s' -n 15 "${GITHUB_SHA}" -- android
            fi
          } > notes.md
          cp "headway-${version}.apk" headway.apk
          gh release create "$tag" headway.apk "headway-${version}.apk" \
            --target "$GITHUB_SHA" --title "Headway ${version}" --notes-file notes.md --latest

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headway-reports-${{ github.run_number }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
