name: Android CI

'on':
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # publishes the APK to the "latest" release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests and debug build
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Lint (report only)
        run: gradle --no-daemon lintDebug
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: headway-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Artifacts always download as .zip; a release asset is a plain .apk with a fixed link:
      # https://github.com/<owner>/<repo>/releases/download/latest/headway.apk
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk headway.apk
          notes="Debug APK built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest headway.apk --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest headway.apk --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headway-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
