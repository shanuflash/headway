name: Advisories

# Keeps advisories.json current from what CMRL publishes (tools/advisories.mjs): service notices,
# extended hours and holiday timetables, and a heads-up when the timetable PDF changes. The apps
# read the committed file, so a change here reaches riders without an app update.
#
# Scheduled runs only happen on the default branch. Run it by hand from the Actions tab any time.
'on':
  schedule:
    - cron: '17 */2 * * *' # every 2 hours, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write # commits advisories.json
  issues: write # opens an issue when the timetable PDF changes
  actions: write # keeps this schedule switched on (see the last step)

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check CMRL for updates
        run: node tools/advisories.mjs

      # Before the commit: if opening the issue fails, the new timetable fingerprint isn't saved
      # either, so the next run sees the change again and retries instead of losing it.
      - name: Open an issue when the timetable changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/timetable-issue.md" ] || { echo "Timetable unchanged."; exit 0; }
          title="CMRL published a new timetable"
          if [ -n "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            echo "An issue is already open."
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/timetable-issue.md"
          fi

      - name: Commit advisories.json if it changed
        run: |
          if git diff --quiet -- advisories.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advisories.json
          git commit -m "Advisories: update from CMRL"
          # Someone may have pushed during the run: rebase onto it and try again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push advisories.json." >&2
          exit 1

      # GitHub turns off schedules in repositories with no activity for 60 days, and this job only
      # commits when CMRL posts something. Enabling it each run keeps the schedule on.
      - name: Keep the schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/advisories.yml/enable" || true
